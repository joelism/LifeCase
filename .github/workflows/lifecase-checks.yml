name: LifeCase prüfen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Veröffentlichte Dateien mit dem Build vergleichen
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- site-assets)"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Mobile Abläufe mit WebKit prüfen
        run: npm run test:browser
        env:
          LIFECASE_TEST_ENGINE: webkit
