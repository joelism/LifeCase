<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeCase</title><style>
:root{color-scheme:light dark;font-family:system-ui;background:#f1f4f8;color:#18263b}*{box-sizing:border-box}body{margin:0}header{padding:24px;background:#18354e;color:white}header h1{margin:0}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#fff;position:sticky;top:0}button,input,select,textarea{font:inherit;border-radius:12px;padding:12px;border:1px solid #aab6c3}button{cursor:pointer;background:#e5edf5;color:#18354e;white-space:nowrap}button.active,button.primary{background:#176b79;color:white;border-color:transparent}main{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,form,article{background:white;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 20px #18354e0b}form{display:grid;gap:12px}label{display:grid;gap:5px}small{color:#61758b}h2{margin-top:0}article p{white-space:pre-wrap}input,textarea,select{width:100%;background:transparent;color:inherit} @media(prefers-color-scheme:dark){:root{background:#101923;color:#e5edf5}nav,.card,form,article{background:#1c2b39}small{color:#b0c1d2}}@media print{nav,form,button,header small{display:none}main{padding:0}article{break-inside:avoid;box-shadow:none}}
</style></head><body><header><h1>LifeCase</h1><small style="color:#d0e3ed">Dein persönliches Dossier</small></header><nav id="nav"></nav><main id="main"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script><script>
const db=supabase.createClient("https://gmulchykvjxkbpcfnspg.supabase.co","sb_publishable_hvQaG7GA94e9a7W1ljt5bw_rU1HNiyz",{auth:{persistSession:false}});let user=null;async function load(){const {data,error}=await db.from("lifecase_records").select("*").order("created_at");if(error)throw error;records=data;render()}function fail(e){alert(e.message||String(e))}function login(){nav.replaceChildren();main.replaceChildren();el("h2","Willkommen bei LifeCase",main);const f=el("form","",main);const email=field(f,"E-Mail","email"),pw=field(f,"Passwort","password");email.required=pw.required=true;el("button","Anmelden",f);f.onsubmit=async e=>{e.preventDefault();try{const {data,error}=await db.auth.signInWithPassword({email:email.value,password:pw.value});if(error)throw error;user=data.user;await load()}catch(e){fail(e)}};el("p","Melde dich mit deinem bestehenden Supabase-Konto an.",main)}
const sections=['Übersicht','Fälle','Chronik','Gesundheit','Arztzeugnisse','Gespräche','Kalender','Beweismittel'];let current=sections[0],records=[];const main=document.querySelector('#main'),nav=document.querySelector('#nav');function el(tag,text,parent){const n=document.createElement(tag);n.textContent=text;if(parent)parent.append(n);return n}function button(text,fn,parent){const n=el('button',text,parent);n.onclick=fn;return n}function field(form,name,type='text'){const l=el('label',name,form);const n=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')n.type=type;n.name=name;l.append(n);return n}function render(){if(!user){login();return}nav.replaceChildren();sections.forEach(s=>{const b=button(s,()=>{current=s;render()},nav);if(s===current)b.className='active'});button('Abmelden',async()=>{await db.auth.signOut();user=null;records=[];login()},nav);main.replaceChildren();el('h2',current,main);el('small','Privates Dossier · Cloud-Speicherung',main);if(current==='Übersicht'){const g=el('div','',main);g.className='grid';sections.slice(1).forEach(s=>{const c=el('div','',g);c.className='card';el('h3',s,c);el('h2',String(records.filter(r=>r.section===s).length),c);button('Öffnen',()=>{current=s;render()},c)});return}const f=el('form','',main);const title=field(f,'Titel');title.required=true;field(f,'Datum','date');field(f,'Fall / Bereich');field(f,'Beteiligte Personen');if(current==='Arztzeugnisse'){field(f,'Gültig ab','date');field(f,'Gültig bis','date');field(f,'Arbeitsunfähigkeit (%)','number')}if(current==='Kalender')field(f,'Uhrzeit','time');field(f,'Sachverhalt / Notizen','textarea');field(f,'Persönliche Einschätzung','textarea');field(f,'Beleg / Quellenangabe');const attachment=field(f,'Dokument hinzufügen','file');attachment.removeAttribute('name');const save=el('button','Eintrag speichern',f);save.className='primary';f.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{const fields=Object.fromEntries(new FormData(f));if(attachment.files[0]){const file=attachment.files[0];const path=user.id+'/'+crypto.randomUUID();const {error}=await db.storage.from('lifecase-private').upload(path,file,{upsert:false});if(error)throw error;fields.Dateipfad=path;fields.Dateiname=file.name;fields.SHA256=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('')}const {error}=await db.from('lifecase_records').insert({section:current,fields});if(error)throw error;await load()}catch(e){fail(e)}finally{save.disabled=false}};button('Dossier drucken / PDF',()=>print(),main);records.filter(r=>r.section===current).slice().reverse().forEach(r=>{const a=el('article','',main);el('h3',r.fields.Titel,a);Object.entries(r.fields).filter(([k,v])=>k!=='Titel'&&v).forEach(([k,v])=>el('p',k+': '+v,a));if(r.fields.Dateipfad)button('Original öffnen',async()=>{try{const {data,error}=await db.storage.from('lifecase-private').download(r.fields.Dateipfad);if(error)throw error;const link=document.createElement('a');link.href=URL.createObjectURL(data);link.download=r.fields.Dateiname;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}catch(e){fail(e)}},a);button('Entfernen',async()=>{if(confirm('Eintrag entfernen? Originaldateien bleiben erhalten.')){try{const {error}=await db.from('lifecase_records').delete().eq('id',r.id);if(error)throw error;await load()}catch(e){fail(e)}}},a)})}render();
</script></body></html>
